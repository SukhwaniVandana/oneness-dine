# ═══════════════════════════════════════════════
# ONENESS DINE — Application Configuration
# ═══════════════════════════════════════════════

spring.application.name=oneness-dine
server.port=8080

# ─── DATABASE ───────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/oneness_dine?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=dummy_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ─── JPA / HIBERNATE ─────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ─── JWT ─────────────────────────────────────────
oneness.jwt.secret=OnEnEsS_D1Ne_JWT_S3cR3t_K3y_2026
oneness.jwt.expiration=86400000

# ─── RABBITMQ ────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ─── WEBSOCKET ───────────────────────────────────
oneness.websocket.allowed-origins=http://localhost:3000,app://.

# ─── SWAGGER ─────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ─── LOGGING ─────────────────────────────────────
logging.level.com.oneness.dine=INFO
logging.level.org.hibernate.SQL=WARN

# ─── APP CONSTANTS ───────────────────────────────
oneness.app.name=ONENESS Dine
oneness.app.version=1.0.0
oneness.table.lock-timeout-minutes=5

springdoc.packages-to-scan=com.oneness.dine
springdoc.paths-to-match=/api/**

# ─── FILE UPLOADS ───────────────────────────────
oneness.upload.path=./uploads
oneness.upload.menu-images=./uploads/menu